<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPyInterVu</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="auth-gate" class="auth-gate hidden" aria-hidden="true">
    <form id="auth-form" class="auth-card">
      <h2>Enter public key</h2>
      <p class="auth-copy">Paste the public key you received outside this app.</p>
      <textarea
        id="public-key-input"
        rows="8"
        placeholder="-----BEGIN PUBLIC KEY-----&#10;...&#10;-----END PUBLIC KEY-----"
        required
      ></textarea>
      <p id="auth-error" class="auth-error hidden" role="alert"></p>
      <button type="submit" id="auth-submit-btn">Continue</button>
    </form>
  </div>

  <main class="app app-locked">
    <header class="header">
      <h1>iPyInterVu</h1>
      <label class="model-label">
        Model
        <select id="model">
          <option value="openai/gpt-4o-mini">openai/gpt-4o-mini</option>
          <option value="anthropic/claude-3.5-sonnet">anthropic/claude-3.5-sonnet</option>
          <option value="google/gemini-2.0-flash-001">google/gemini-2.0-flash-001</option>
          <option value="deepseek/deepseek-v4-flash">deepseek/deepseek-v4-flash</option>
        </select>
      </label>
    </header>

    <section id="messages" class="messages" aria-live="polite"></section>

    <form id="chat-form" class="composer">
      <textarea
        id="prompt"
        rows="3"
        placeholder="Ask something..."
        required
      ></textarea>
      <div class="composer-actions">
        <button type="button" id="clear-btn">Clear</button>
        <button type="submit" id="send-btn">Send</button>
      </div>
    </form>
  </main>

  <script src="/app.js"></script>
</body>
</html>
